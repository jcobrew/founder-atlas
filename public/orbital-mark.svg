<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">0rbital mark</title>
  <desc id="desc">A center dot with an outer satellite moving along a visible circular orbit.</desc>
  <style>
    .orbital-motion { transform-origin: 64px 64px; animation: orbital-spin 2.4s linear infinite; }
    @keyframes orbital-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .orbital-motion { animation: none; } }
  </style>
  <defs>
    <mask id="orbit-gap" maskUnits="userSpaceOnUse">
      <rect width="128" height="128" fill="white"/>
      <g class="orbital-motion">
        <circle cx="64" cy="16" r="16" fill="black"/>
      </g>
    </mask>
  </defs>
  <rect width="128" height="128" fill="transparent"/>
  <circle cx="64" cy="64" r="48" fill="none" stroke="#f8f8f8" stroke-width="9.5" mask="url(#orbit-gap)"/>
  <circle cx="64" cy="64" r="10.5" fill="#f8f8f8"/>
  <g class="orbital-motion">
    <circle cx="64" cy="16" r="10.5" fill="#f8f8f8"/>
  </g>
</svg>
