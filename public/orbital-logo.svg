<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 128" role="img" aria-labelledby="title desc">
  <title id="title">0rbital logo</title>
  <desc id="desc">0rbital orbital mark and geometric ORBITAL wordmark.</desc>
  <style>
    .orbital-motion { transform-origin: 64px 64px; animation: orbital-spin 2.4s linear infinite; }
    @keyframes orbital-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .orbital-motion { animation: none; } }
  </style>
  <rect width="620" height="128" fill="transparent"/>
  <g>
    <g class="orbital-motion">
      <path d="M82 19.4A48 48 0 1 1 46 19.4" fill="none" stroke="#f8f8f8" stroke-width="9.5" stroke-linecap="butt"/>
      <circle cx="64" cy="16" r="10.5" fill="#f8f8f8"/>
    </g>
    <circle cx="64" cy="64" r="10.5" fill="#f8f8f8"/>
  </g>
  <g fill="#f8f8f8" transform="translate(158 26)" font-family="'JetBrains Mono', 'Space Grotesk', monospace" font-size="76" font-weight="700" letter-spacing="8">
    <text x="0" y="73">ORBITAL</text>
  </g>
</svg>
