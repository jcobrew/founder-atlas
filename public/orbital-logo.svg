<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 128" role="img" aria-labelledby="title desc">
  <title id="title">0rbital logo</title>
  <desc id="desc">0rbital orbital mark and geometric wordmark with a one-styled final letter.</desc>
  <style>
    .orbital-satellite { transform-origin: 64px 64px; animation: orbital-spin 2.4s linear infinite; }
    @keyframes orbital-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .orbital-satellite { animation: none; } }
  </style>
  <rect width="620" height="128" fill="transparent"/>
  <g>
    <path d="M95.8 35.4A49.5 49.5 0 1 1 82.2 22" fill="none" stroke="#f8f8f8" stroke-linecap="butt" stroke-width="9.5"/>
    <circle cx="61" cy="66" r="10.5" fill="#f8f8f8"/>
    <g class="orbital-satellite">
      <circle cx="93" cy="32" r="10.5" fill="#f8f8f8"/>
    </g>
  </g>
  <g fill="#f8f8f8" transform="translate(158 26)" font-family="'JetBrains Mono', 'Space Grotesk', monospace" font-size="76" font-weight="700" letter-spacing="8">
    <text x="0" y="73">0RBITA1</text>
  </g>
</svg>
